services:
  subtranslator:
    image: cyberfrostfall/subtranslator:latest
    pull_policy: always
    container_name: subtranslator
    restart: unless-stopped

    environment:
      - API_KEY=${API_KEY}
      - PROXY_URL=${PROXY_URL:-}
      - MODEL=${MODEL:-}
      - MOVIES_DIR=${MOVIES_DIR:-/mnt/user/media/media/movies}
      - TV_DIR=${TV_DIR:-/mnt/user/media/media/tv}
      - CUSTOM_DIRS=${CUSTOM_DIRS:-}
      - MAX_WORKERS=${MAX_WORKERS:-10}
      - API_RETRY_COUNT=${API_RETRY_COUNT:-3}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WEB_PORT=${WEB_PORT:-8095}
      - TARGET_LANG=${TARGET_LANG:-zh}
      - CORS_ORIGINS=${CORS_ORIGINS:-}

    volumes:
      - ./config:/config
      - ${MEDIA_PATH:-/mnt/user/media}:/mnt/user/media

    ports:
      - "${WEB_PORT:-8095}:${WEB_PORT:-8095}"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; from config_manager import load_config; urllib.request.urlopen('http://localhost:%s/health' % load_config()['WEB_PORT'], timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
